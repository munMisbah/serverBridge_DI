<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#070a0e" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Subtle border glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.4" />
  <!-- Dynamic Island Capsule Pill -->
  <rect x="76" y="206" width="360" height="100" rx="50" fill="#000000" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />
  <!-- Inner camera notch dot -->
  <circle cx="136" cy="256" r="16" fill="#18181b" stroke="#27272a" stroke-width="2" />
  <circle cx="136" cy="256" r="6" fill="#09090b" />
  <!-- Audio wave indicator bars on right -->
  <rect x="360" y="244" width="4" height="24" rx="2" fill="#34d399" />
  <rect x="372" y="236" width="4" height="40" rx="2" fill="#34d399" />
  <rect x="384" y="248" width="4" height="16" rx="2" fill="#34d399" />
</svg>
