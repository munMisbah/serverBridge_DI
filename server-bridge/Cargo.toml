[package]
name = "di-server-bridge"
version = "0.1.0"
edition = "2021"
description = "Lightweight host metrics bridge for Dynamic Island for Windows"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
